apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CBP-25252-cloudbees-scm-sha-in-uses

on:
  #push:
  workflow_dispatch: {}  

# -----------------------------------------------------------------------
# CBP-25252: Verify cloudbees.scm.sha is supported in the 'uses' field
#
# Strategy: First build a trivial image tagged with cloudbees.scm.sha,
# then reference that image via cloudbees.scm.sha in each DSL context.
#
# Acceptance criteria:
#   1. Workflow DSL - regular steps        (job: regular-step)
#   2. Workflow DSL - sidecar services     (job: sidecar-service)
#   3. Action DSL                          (job: action-dsl)
#   4. Custom Job DSL                      (job: custom-job-dsl)
# -----------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------
  # Build a test image tagged with the commit SHA
  # -------------------------------------------------------------------
  build-image:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v1

      - name: Create a minimal Dockerfile
        uses: docker://alpine:3.18
        run: |
          echo 'FROM alpine:3.18' > Dockerfile
          echo 'CMD ["echo", "CBP-25252 test image"]' >> Dockerfile

      - name: Configure container registry for ECR
        uses: cloudbees-io/configure-ecr-credentials@v1
        with:
          registries: "020229604682"

      - name: Build and push SHA-tagged image
        uses: cloudbees-io/kaniko@v1
        with:
          destination: 020229604682.dkr.ecr.us-east-1.amazonaws.com/testing/cbp-25252-test:${{ cloudbees.scm.sha }}
          context: .
          dockerfile: Dockerfile

  # -------------------------------------------------------------------
  # AC 1: Workflow DSL - regular step uses
  # -------------------------------------------------------------------
  regular-step:
    needs:
      - build-image
    steps:
      - name: Verify cloudbees.scm.sha resolves in step uses
        uses: docker://020229604682.dkr.ecr.us-east-1.amazonaws.com/testing/cbp-25252-test:${{ cloudbees.scm.sha }}
        run: |
          echo "=== AC 1: Regular Step ==="
          echo "PASS: cloudbees.scm.sha resolved in regular step uses"

  # -------------------------------------------------------------------
  # AC 2: Workflow DSL - sidecar service image
  # -------------------------------------------------------------------
  sidecar-service:
    needs:
      - regular-step
    services:
      test-svc:
        image: 020229604682.dkr.ecr.us-east-1.amazonaws.com/testing/cbp-25252-test:${{ cloudbees.scm.sha }}
        ports:
          - 8080

    steps:
      - name: Verify sidecar started with SHA-tagged image
        uses: docker://alpine:3.18
        run: |
          echo "=== AC 2: Sidecar Service ==="
          echo "PASS: cloudbees.scm.sha resolved in sidecar service image"

  # -------------------------------------------------------------------
  # AC 3: Action DSL
  # -------------------------------------------------------------------
  action-dsl:
    needs:
      - sidecar-service
    steps:
      - name: Invoke action that uses cloudbees.scm.sha
        uses: ./.cloudbees/actions/sha-tagged-action

  # -------------------------------------------------------------------
  # AC 4: Custom Job DSL
  # -------------------------------------------------------------------
  custom-job-dsl:
    needs:
      - action-dsl
    delegates: ./.cloudbees/customjobs/sha-tagged-customjob.yml
    with:
      message: "CBP-25252 custom job test"

  # -------------------------------------------------------------------
  # Summary
  # -------------------------------------------------------------------
  summary:
    needs:
      - custom-job-dsl
    steps:
      - name: Report results
        uses: docker://alpine:3.18
        run: |
          echo "==========================================="
          echo "CBP-25252: All acceptance criteria passed"
          echo "==========================================="
          echo ""
          echo "  AC 1: Regular step uses      - PASS"
          echo "  AC 2: Sidecar service image  - PASS"
          echo "  AC 3: Action DSL             - PASS"
          echo "  AC 4: Custom Job DSL         - PASS"
          echo ""
          echo "cloudbees.scm.sha is now supported in the"
          echo "uses field across all DSL types."
