apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CBP-25252-cloudbees-scm-sha-in-uses

on:
  #push:
  workflow_dispatch: {}  

# -----------------------------------------------------------------------
# CBP-25252: Verify cloudbees.scm.sha is supported in the 'uses' field
#
# Acceptance criteria:
#   1. Workflow DSL - regular steps        (job: regular-step)
#   2. Workflow DSL - sidecar services     (job: sidecar-service)
#   3. Action DSL                          (job: action-dsl)
#   4. Custom Job DSL                      (job: custom-job-dsl)
# -----------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------
  # AC 1: Workflow DSL - regular step uses
  # -------------------------------------------------------------------
  regular-step:
    steps:
      - name: Verify cloudbees.scm.sha resolves in uses
        uses: docker://alpine:${{ cloudbees.scm.sha }}
        env:
          CLOUDBEES_SCM_SHA: ${{ cloudbees.scm.sha }}
        run: |
          echo "=== AC 1: Regular Step ==="
          echo "cloudbees.scm.sha = ${CLOUDBEES_SCM_SHA}"

          if [ -z "${CLOUDBEES_SCM_SHA}" ]; then
            echo "FAIL: cloudbees.scm.sha is empty"
            exit 1
          fi
          echo "PASS: cloudbees.scm.sha resolved in regular step uses"

  # -------------------------------------------------------------------
  # AC 2: Workflow DSL - sidecar service image
  # -------------------------------------------------------------------
  sidecar-service:
    services:
      redis:
        image: redis:${{ cloudbees.scm.sha }}
        ports:
          - 6379
        healthcheck:
          cmd: redis-cli ping
          timeout-seconds: 5

    steps:
      - name: Verify sidecar started with SHA-tagged image
        uses: docker://alpine:3.18
        env:
          CLOUDBEES_SCM_SHA: ${{ cloudbees.scm.sha }}
        run: |
          echo "=== AC 2: Sidecar Service ==="
          echo "Service image resolved to: redis:${CLOUDBEES_SCM_SHA}"
          echo "PASS: cloudbees.scm.sha resolved in sidecar service image"

  # -------------------------------------------------------------------
  # AC 3: Action DSL
  # -------------------------------------------------------------------
  action-dsl:
    steps:
      - name: Invoke action that uses cloudbees.scm.sha
        uses: ./.cloudbees/actions/sha-tagged-action
    outputs:
      status: done

  # -------------------------------------------------------------------
  # AC 4: Custom Job DSL
  # -------------------------------------------------------------------
  custom-job-dsl:
    delegates: ./.cloudbees/customjobs/sha-tagged-customjob.yml
    with:
      message: "CBP-25252 custom job test"

  # -------------------------------------------------------------------
  # Summary
  # -------------------------------------------------------------------
  summary:
    needs:
      - regular-step
      - sidecar-service
      - action-dsl
      - custom-job-dsl
    steps:
      - name: Report results
        uses: docker://alpine:3.18
        run: |
          echo "==========================================="
          echo "CBP-25252: All acceptance criteria passed"
          echo "==========================================="
          echo ""
          echo "  AC 1: Regular step uses      - PASS"
          echo "  AC 2: Sidecar service image  - PASS"
          echo "  AC 3: Action DSL             - PASS"
          echo "  AC 4: Custom Job DSL         - PASS"
          echo ""
          echo "cloudbees.scm.sha is now supported in the"
          echo "uses field across all DSL types."
